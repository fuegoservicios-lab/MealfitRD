# [P2-SUPPLY-CHAIN 2026-08-18] Acciones fijadas por SHA, no por tag.
#
# Un tag como `@v4` es un puntero MUTABLE: quien controle el repo de la accion
# puede moverlo, y tu workflow —que corre con acceso al repo y a los secrets—
# ejecutaria codigo distinto sin que cambie una linea aqui. Ha pasado de verdad
# en el ecosistema (tj-actions/changed-files, marzo 2025). Un SHA no se mueve.
#
# El comentario `# vN` de cada linea es a que tag apuntaba ese SHA el dia que se
# fijo. Para actualizarlas: Dependabot abre el PR con el SHA nuevo.
# [P1-2 · CI · 2026-07-12] Gate de calidad + seguridad para el repo frontend.
# El repo es standalone (github.com/fuegoservicios-lab/MealfitRD) — antes NADA
# corría en push. `quality` cubre lint+typecheck+test+build; `audit` gatea vulns
# high/critical de prod fuera de la allowlist (scripts/audit-gate.mjs).
name: ci

# Permisos MINIMOS. Sin este bloque, el `GITHUB_TOKEN` hereda los del repo, que
# suelen incluir escritura: un workflow que solo necesita leer codigo podria
# empujar commits o publicar releases si algo que ejecuta se tuerce.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # [P1-CI-GATE] i18n en ESTRICTO. El motor de traduccion usa el texto espanol
      # COMO clave, asi que editar un copy huerfana su traduccion en los cuatro
      # idiomas EN SILENCIO: la app sigue funcionando —lo no traducido cae a
      # espanol— y nadie se entera hasta que un usuario lee media pantalla en otro
      # idioma. Este comprobador es la unica defensa que existe contra eso.
      # `--strict` ademas exige 100% de cobertura, que es el estado actual.
      #
      # [P2-I18N-GATE-ACTIONS-INALCANZABLE · 2026-08-22] VA EL PRIMERO, y esa es la
      # decision que importa. Antes era el paso 10 de una cadena SERIAL sin
      # `if: always()`, detras de cinco pasos bloqueantes. Medido: 21 corridas
      # consecutivas con este paso en `skipped` (2026-08-21T23:37 -> 2026-08-22T06:09),
      # y toda la ola que cerro los 58 gaps de i18n se mergeo sin que corriera ni una vez.
      #
      # La causa de aquellas 21 fue UN `vi` importado y sin usar en un test: un error de
      # eslint —no un aviso— que `--max-warnings` no puede absorber. O sea que el gate que
      # vigila las traducciones dependia de que NADIE dejara un import muerto en ningun
      # sitio del repo. Y no es hipotetico que se repita: el conteo de avisos esta HOY
      # justo en el tope (66 de 66), asi que el margen para volver a tumbarlo es cero.
      #
      # Ponerlo delante en vez de darle `if: always()` es a proposito: tarda ~2 s, su fallo
      # es de una linea, y asi la causa sale antes que los ~2 min de vitest. Es el MISMO
      # orden que ya usa el gate de release (`scripts/run_ci.ps1`, «Frontend i18n» antes de
      # «Frontend vitest»), que es justo el que NO se rompio en esas 21 corridas.
      - run: npm run i18n:check:strict
      # Tope = estado actual (P2-LINT-ZERO lo baja a 0). Bloquea warnings NUEVOS.
      #
      # [P1-CI-GATE-PASSABLE · 2026-08-14] 148 -> 164, y la razon importa mas que
      # el numero. El 148 se puso el 2026-07-12 como "estado actual" y el gate
      # llevaba rojo desde que el lockfile subio `eslint-plugin-react-hooks` a
      # 7.0.1: la version trae la regla `set-state-in-effect`, que aporto 16
      # warnings de golpe sobre codigo que nadie habia tocado. O sea que el job
      # fallaba sin que existiera ni un defecto nuevo.
      #
      # Un gate que no puede pasar deja de ser un gate: entrena a leer el rojo
      # como ruido, y entonces el rojo de verdad tampoco se lee. Es literalmente
      # la leccion del commit ac042bd ("El gate del deploy tiene que poder pasar,
      # o entrena a saltarselo"), aplicada al otro gate.
      #
      # 163 = medicion del 2026-08-14. Reparto: 98 no-restricted-syntax
      # (localStorage crudo, boy-scout declarado), 25
      # react-refresh/only-export-components, 24 exhaustive-deps, 16
      # set-state-in-effect. CERO errores.
      #
      # Estuvo unas horas en 164 (tras borrar las 18 directivas huerfanas con
      # `--fix-type directive` y sacar `coverage/` del lint). Una tanda del modo
      # contador lo dejo en 165 -- un warning POR ENCIMA, o sea el job rojo otra
      # vez, y esta vez `npm run lint:count` lo dijo con el numero delante: que es
      # exactamente para lo que se anadio.
      #
      # Se BAJO a 163 en vez de subirlo a 165, porque el delta venia de CODIGO y la
      # regla de abajo dice que entonces se arregla el codigo. Los dos warnings
      # sobrantes eran `react-refresh/only-export-components` en helpers de TEST,
      # donde la regla no puede aplicar jamas (Fast Refresh no toca un fichero de
      # test: no lo sirve Vite en dev, no se monta, no tiene estado que preservar).
      # Se apago ahi POR ALCANCE, no por conveniencia. El techo baja con el suelo:
      # asi es un trinquete y el margen no se rellena sin que nadie lo vea.
      #
      # [2026-08-18] El job llevaba rojo otra vez: 168 contra el techo de 163. El delta
      # venia de CODIGO (5 exhaustive-deps nuevos + 1 react-refresh, menos 1 no-restricted
      # que se fue), asi que se arreglo el codigo y el techo NO se toco. Vuelve a 163.
      #
      # Lo que hay que saber para la proxima: en `eslint-plugin-react-hooks@7` las reglas
      # nuevas (`set-state-in-effect` y hermanas) vienen del React Compiler, y un
      # `eslint-disable-next-line` BAILEA AL COMPONENTE ENTERO de esas reglas. Medido en
      # este mismo arreglo: silenciar el `exhaustive-deps` de `LoadingScreen` (Plan.jsx)
      # con un disable dejaba el conteo en 162 — pero uno de esos 6 warnings no estaba
      # arreglado, estaba ESCONDIDO. Un techo que baja porque apagaste la luz no es un
      # trinquete, es el mismo autoengano que el 148.
      #
      # Regla practica: para un «unnecessary dependency» que en realidad es real (patron
      # tick, copy que depende del idioma), referencia la variable en el cuerpo con `void`
      # en vez de un disable — satisface al linter sin mentir y sin apagar el compilador.
      # El disable queda para lo que no se puede expresar de otra forma (una funcion no
      # memoizada que NO debe entrar en las deps), y preferiblemente en un componente que
      # ya tuviera uno.
      #
      # COMO RECALIBRAR cuando el toolchain se mueva: `npm run lint:count` da el
      # numero de hoy. Subirlo es legitimo SOLO si el delta viene de una regla
      # nueva (bump de plugin) y no de codigo nuevo — si viene de codigo, el
      # arreglo es el codigo. Escribe la causa aqui como estan escritas las dos
      # anteriores; sin causa, el proximo que lo vea no sabra si puede bajarlo.
      # [P2-CODIGO-MUERTO 2026-08-18] 163 -> 158. El techo BAJA con el suelo:
      # borrar `ChatWidget.jsx` (829 lineas inalcanzables) se llevo sus 5
      # warnings de localStorage. Si el techo no baja con el, el margen se
      # rellena solo y sin que nadie lo vea, que es lo contrario de un trinquete.
      # [P2-LIVE-1 · 2026-05-12 → G31 · 2026-08-23] El lint de CI nació como job
      # aparte no-bloqueante en el ci.yml de la RAÍZ (245 errores de baseline).
      # Hoy la baseline está limpia y el lint es BLOQUEANTE vía el tope de avisos.
      - run: npx eslint . --max-warnings 66
      # [P2-LINT-RATCHET-POR-REGLA] El techo global es FUNGIBLE: arreglar un aviso
      # de estilo libera hueco para que entre uno de hooks, y el numero total no
      # se entera. Este gate pone techo POR REGLA, y una regla no declarada tiene
      # techo 0 — asi un bump de plugin que trae reglas nuevas sale a la cara en
      # vez de esconderse bajo el margen de las demas, que es literalmente lo que
      # paso con `set-state-in-effect` y dejo este job rojo semanas.
      # El conteo queda en el log del job pase o no pase: la deriva de 148 a 180
      # fue invisible durante un mes porque nadie tenia el numero delante. Es la
      # MISMA invocacion que gatea — correrlo dos veces solo pagaba eslint dos veces.
      - run: npm run lint:count -- --gate
      - run: npm run typecheck
      # [P2-CODIGO-MUERTO] Modulos que no alcanza NADA de produccion. `ChatWidget.jsx`
      # vivio aqui 829 lineas manteniendose vivo con sus PROPIOS tests: `grep` lo veia
      # en catorce ficheros y parecia muy usado. Un fichero al que solo llegan sus
      # tests no esta cubierto, esta sostenido. El gate recorre el grafo desde las
      # entradas reales (main.jsx y el service worker) en vez de contar menciones.
      - run: node scripts/huerfanos.mjs --gate
      - run: npm test
      - run: npm run build
      # [P1-CI-GATE] El tope del bundle del agente. Existia el script y tampoco
      # corria: un cap que nadie evalua no es un cap.
      #
      # [P1-CI-QUALITY-ABORTADO · 2026-08-21] Va DESPUES del build, y antes no.
      # Lee `dist/assets/AgentPage-*.js`, que en un checkout limpio no existe
      # todavia: colocado antes, el paso no podia pasar NUNCA y abortaba el job
      # con todo lo que venia detras. Misma razon por la que
      # `check:presupuestos` ya estaba despues — solo que a este se le olvido.
      - run: npm run check:bundle-size
      # [P1-PRESUPUESTOS] Peso de la carga inicial, con techo. Habia guards para el
      # precache y para la pagina del agente, y ninguno para lo primero que baja
      # CUALQUIER visitante. El peso del arranque es la magnitud que empeora sin
      # que nadie lo decida: un import nuevo en un fichero que ya estaba en el
      # camino critico no crea ningun fichero, asi que no se ve en el diff. Va
      # DESPUES del build porque mide `dist/`.
      - run: npm run check:presupuestos

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/audit-gate.mjs

  # [P2-SUPPLY-CHAIN 2026-08-18] SBOM por release y contrato de entorno.
  #
  # El SBOM (CycloneDX) es la lista de lo que de verdad va dentro del artefacto.
  # Sin el, cuando salga el proximo advisory de una dependencia transitiva la
  # pregunta «¿nos afecta?» se contesta reconstruyendo el arbol a mano.
  suministro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falla si alguien mete en el artefacto una variable que no deberia estar
      # ahi: `VITE_` publica su valor DENTRO del bundle, en texto plano.
      - run: node scripts/env-gate.mjs
      - name: SBOM CycloneDX
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cyclonedx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

  # [P2-CROSS-BROWSER · 2026-08-18] El smoke e2e, que existia desde mayo y NUNCA
  # habia corrido en CI: `test:e2e` estaba en package.json y ningun job lo
  # llamaba. Una prueba que solo se ejecuta cuando alguien se acuerda no es un
  # gate, es documentacion.
  #
  # UN MOTOR POR JOB, no los tres en uno. Corren en paralelo (7 min cada uno en
  # vez de 21 en serie) y, sobre todo, el informe dice CUAL falla sin abrir el
  # log: «e2e (webkit)» en rojo y los otros dos verdes es un diagnostico, no una
  # pista.
  #
  # WebKit es el que justifica todo esto: es el motor de Safari y el de TODOS los
  # navegadores de iOS, y no hay forma de probarlo a mano desde Windows. En la
  # primera pasada con los tres encontro dos defectos reales en pruebas que
  # llevaban meses en verde con chromium solo.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false          # un motor rojo no oculta el resultado de los otros
      matrix:
        motor: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Solo el motor de ESTE job: bajar los tres a cada uno seria triplicar la
      # descarga para usar un tercio.
      - run: npx playwright install --with-deps ${{ matrix.motor }}
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.motor }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: playwright-${{ matrix.motor }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
