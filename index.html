       accidental (pinch de 2 dedos al scrollear carruseles horizontales, doble-tap,
       auto-zoom de iOS al enfocar campos) se disparaba SIN QUERER y dejaba la UI
       ampliada/cortada — pésimo UX en un PWA standalone. maximum-scale=1 +
       user-scalable=no bloquea el pinch en Android Chrome (respeta el flag) y en el
       PWA standalone de iOS; se complementa con `touch-action: manipulation` (mata
       doble-tap) y un preventer de gestos iOS en main.jsx (Safari ignora
       user-scalable=no en browser). Trade-off WCAG aceptado: el texto sigue legible

  <!-- [P1-I18N-DASHBOARD · 2026-08-15] No-flash language boot. Hermano del boot
       de tema de abajo y por el mismo motivo: el atributo tiene que estar puesto
       ANTES del primer paint. `<html lang>` no es cosmético — es lo que decide
       qué voz usa un lector de pantalla, qué diccionario usa el corrector del
       navegador y si Chrome ofrece «traducir esta página». Un usuario en francés
       cuyo `lang` diga es-DO hasta que React monte es escuchado en español por
       VoiceOver durante ese rato.
       El valor sale de localStorage('mealfit_locale'), que es la CACHÉ de
       `user_profiles.locale` — la fuente de verdad viaja por red y no está
       disponible aquí. La lista es copia literal de src/i18n/locales.js y está
       anclada por backend/tests/test_p1_i18n_dashboard.py, así que un idioma
       nuevo que no se añada aquí falla en CI en vez de fallar en silencio.
       Defensivo: cualquier excepción (Safari privado, ITP, webviews que lanzan
       al tocar localStorage) deja el es-DO del atributo estático. -->
  <script>
    (function () {
      try {
        var SUPPORTED = ['es-DO', 'en-US', 'pt-BR', 'fr-FR', 'it-IT'];
        var stored = localStorage.getItem('mealfit_locale');
        if (SUPPORTED.indexOf(stored) > 0) {
          document.documentElement.setAttribute('lang', stored);
          // [P1-SPLASH-I18N · 2026-08-20] Se publica para el splash, que está en
          // <body> y no puede leerlo desde aquí. Una sola lectura de localStorage.
          window.__mfLocale = stored;
        }
      } catch (e) {
        /* el lang="es-DO" del <html> estático ya es el fallback correcto */
      }
    })();
  </script>

  <!-- [APPEARANCE-THEME · 2026-05-28] No-flash theme boot. Corre síncrono en
       <head> ANTES del primer paint (y antes del splash) para que el atributo
       html[data-theme] esté fijado cuando el navegador pinte. Lee la
       preferencia persistida en localStorage('mealfit_theme') — system|light|
       dark — y la resuelve a un valor concreto (system → prefers-color-scheme).
       El motor JS (src/utils/theme.js) re-aplica esto en runtime y escucha
       cambios del sistema; este script solo evita el flash de tema claro→oscuro
       en el arranque en frío. [P3-DEFAULT-DARK] Default = 'dark'; un 'system' previo
       migra a 'dark' one-time. Defensivo: cualquier excepción cae a 'dark'. -->
  <script>
    (function () {
      // [P1-PAPER-SURFACE-SSOT · 2026-08-01 · ampliado 2026-08-02] Superficie
      // papel: estas rutas fuerzan tema síncrono en carga directa/refresh para
      // evitar el flash. Copia literal de src/utils/paperSurface.js — anclada
      // por backend/tests/test_p1_paper_surface_ssot.py.
      // [P1-PAPER-SURFACE-EXTEND · 2026-08-02] `PAPER_PFX` cubre las rutas
      // DINÁMICAS (/novedades/<slug>), que un `indexOf` exacto no puede ver.
      // `paperPath()` es el ÚNICO predicado: lo consultan tanto el camino
      // normal como el `catch`, para que no puedan divergir.
      // [P1-PAPER-THEME fix · 2026-08-02] La declaración vive FUERA del try a
      // propósito. Antes estaba dentro y el `catch` fijaba 'dark' a ciegas: si
      // localStorage lanza (Safari privado, ITP, algunos webviews) la excepción
      // salta en la PRIMERA lectura, antes de esta línea, así que en el catch
      // `PAPER` ni siquiera existía todavía. Consecuencia: una carga directa de
      // /precios pintaba el splash ENTERO en navy — el splash vive fuera de
      // #root, así que ningún CSS de React lo alcanza — hasta que React montaba
      // y corregía, y entonces saltaba a blanco. Es exactamente el flash que
      // este bloque existe para evitar. Sacarla del try es lo que permite que
      // el catch consulte la MISMA lista, sin duplicarla en un cuarto sitio.
      // [P1-PAPER-LEGAL · 2026-08-02] +9 legales. `/cookies` incluida aunque
      // sea un redirect a /privacy: este script corre ANTES de que React lo
      // resuelva, así que sin ella la carga en frío pinta un frame oscuro.
      var PAPER = ['/', '/precios', '/como-funciona', '/funciones', '/precision', '/motor', '/research', '/novedades', '/supermercado', '/about', '/privacy', '/terms', '/cookies', '/medical', '/data-protection', '/ai-policy', '/refunds', '/acceptable-use', '/responsible-disclosure'];
      var PAPER_PFX = ['/novedades/'];
      function paperPath(p) {
        if (PAPER.indexOf(p) !== -1) return true;
        for (var i = 0; i < PAPER_PFX.length; i++) {
          if (p.indexOf(PAPER_PFX[i]) === 0) return true;
        }
        return false;
      }
      try {
        // [P3-DEFAULT-DARK · 2026-06-01] Migración one-time: un 'system' previo
        // pasa a 'dark' una sola vez (decisión: oscuro por defecto). Tras esto,
        // re-elegir "Sistema" persiste normal. Sin preferencia → 'dark' por default.
        if (!localStorage.getItem('mealfit_theme_dark_default_v1')) {
          if (localStorage.getItem('mealfit_theme') === 'system') {
            localStorage.setItem('mealfit_theme', 'dark');
          }
          localStorage.setItem('mealfit_theme_dark_default_v1', '1');
        }
        var pref = localStorage.getItem('mealfit_theme') || 'dark';
        var dark = pref === 'dark' ? true
          : pref === 'light' ? false
          : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        if (paperPath(location.pathname)) theme = 'paper';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        // El fallback defensivo sigue siendo 'dark', pero la ruta manda: en la
        // superficie papel un fallback a 'dark' NO es defensivo, es la
        // regresión. `paperPath` está declarada arriba, fuera del try, justamente
        // para que esta línea no pueda quedarse sin ella.
        document.documentElement.setAttribute(
          'data-theme',
          paperPath(location.pathname) ? 'paper' : 'dark'
        );
      }
    })();
  </script>

    #pwa-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 50% 35%, rgba(79, 70, 229, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 50% 70%, rgba(244, 63, 94, 0.05) 0%, transparent 55%),
        #F8FAFC;
      animation: splashFadeIn 0.4s ease-out;
    }
    @keyframes splashFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .splash-brand {
      font-size: 44px;
      font-weight: 800;
      color: #0F172A;
      /* -0.03em = el mismo tracking cerrado que `Wordmark.jsx`. Es el ÚNICO
         recurso del wordmark ahora que es monocromo, así que las dos copias
         tienen que llevarlo igual o el splash y la app se ven distintos. */
      letter-spacing: -0.03em;
      line-height: 1;
      animation: splashRise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.05s;
    }
    .splash-tagline {
      font-size: 15px;
      font-weight: 500;
      color: #64748B;
      margin-top: 14px;
      letter-spacing: 0.01em;
      animation: splashRise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.18s;
    }
    @keyframes splashRise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .splash-dots {
      display: flex;
      gap: 8px;
      margin-top: 40px;
      animation: splashRise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.3s;
    }
    /* Una sola tinta, como el wordmark: tres puntos indigo/violeta/rosa debajo
       de una marca monocroma dejaban la pantalla a medio camino. El ritmo lo da
       el desfase de la animación, no el color. */
    .splash-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94A3B8;
      opacity: 0.35;
      animation: splashDot 1.2s ease-in-out infinite;
    }
    .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
    .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes splashDot {
      0%, 80%, 100% { opacity: 0.35; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1.15); }
    }
    /* [APPEARANCE-THEME · 2026-05-28] Splash oscuro driven por html[data-theme]
       (lo fija el boot script de arriba) en vez de @media prefers-color-scheme.
       Así respeta la elección EXPLÍCITA del usuario: si eligió "Básico" (light)
       pero su SO está en oscuro, el splash se queda claro — y viceversa. El
       valor "system" ya quedó resuelto a dark/light por el boot script. */
    html[data-theme="dark"] #pwa-splash {
      background:
        radial-gradient(ellipse 80% 60% at 50% 35%, rgba(129, 140, 248, 0.14) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 50% 70%, rgba(244, 63, 94, 0.08) 0%, transparent 55%),
        #0B1120;
    }
    html[data-theme="dark"] .splash-brand { color: #F8FAFC; }
    html[data-theme="dark"] .splash-tagline { color: #94A3B8; }
    html[data-theme="dark"] .splash-dots span { background: #CBD5E1; }
    /* [P1-PAPER-THEME · 2026-08-01] El splash vive FUERA de #root (body, no
       React), así que ningún CSS de la app lo alcanza: necesita su propia
       copia de la paleta papel. Sin esto cae a su base — dos radiales indigo
       + rosa sobre #F8FAFC — en cada carga directa o refresh de las 6 rutas.
       Sin gradientes: el papel es plano. */
    html[data-theme="paper"] #pwa-splash { background: #FBFBFA; }
    html[data-theme="paper"] .splash-brand { color: #0B0B0B; }
    html[data-theme="paper"] .splash-tagline { color: #3D3D3B; }
    html[data-theme="paper"] .splash-dots span { background: #6A6A66; }
    @media (prefers-reduced-motion: reduce) {
      #pwa-splash, .splash-brand, .splash-tagline, .splash-dots { animation: none !important; }
      .splash-dots span { animation: splashDotReduced 1.6s ease-in-out infinite; }
      @keyframes splashDotReduced {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    }
  </style>
</head>

  <!-- PWA Native Splash Screen placed OUTSIDE root so React doesn't destroy it -->
  <div id="pwa-splash" style="transition: opacity 0.5s ease; opacity: 1;">
    <!-- [P2-WORDMARK-BIOBOROS · 2026-07-31] La marca va en UNA pieza, sin spans.
         Este splash corre antes de que React monte, así que no puede usar
         `<Wordmark/>`; es la única copia legítima de la marca fuera del SSOT y
         por eso el guard la vigila aparte. No volver a partirla: las clases
         `splash-r`/`splash-d` eran la "R" y la "D" de MealfitRD (donde el país
         significaba algo) y el rebrand heredó el bicolor partiendo "b"+"oros",
         un corte sin referente. -->
    <div class="splash-brand">Bioboros</div>
    <div class="splash-tagline">Nutrición personalizada con IA</div>
    <!-- [P3-NEW-SPLASH-A11Y · 2026-05-15] aria-live="polite" + aria-busy="true" + role="status" para que screen readers anuncien el loading state. Pre-fix solo aria-label. -->
    <div class="splash-dots" aria-label="Cargando" aria-live="polite" aria-busy="true" role="status">
      <span></span><span></span><span></span>
    </div>
    <!-- [P1-SPLASH-I18N · 2026-08-20] El splash se pinta ANTES de que React y el motor
         de i18n existan, así que `t()` no está disponible: era la única superficie de la
         app que seguía en español con el idioma en inglés, y la última que uno mira
         porque dura un segundo.

         El script va aquí, INMEDIATAMENTE después de los nodos, y no en un
         `DOMContentLoaded`: corre durante el parseo, antes del primer paint, así que no
         hay parpadeo de español. Mismo patrón que el boot del tema.

         POR QUÉ EL TEXTO NO SALE DE LOS CATÁLOGOS: nadie llama a `t()` con estas
         cadenas —no pueden, el motor aún no existe—, así que meterlas en los `.json`
         las volvería HUÉRFANAS y `npm run i18n:check` empezaría a avisar de algo
         correcto. Un guard que avisa de lo correcto se acaba ignorando. El SSOT es este
         mapa, y `test_p1_splash_i18n.py` lo ancla: los 5 idiomas presentes y es-DO
         idéntico al HTML estático.

         Defensivo igual que sus hermanos: cualquier excepción deja el español del
         marcado, que es el fallback correcto. -->
    <script>
      (function () {
        try {
          var TAGLINE = {
            'es-DO': 'Nutrición personalizada con IA',
            'en-US': 'AI-powered personalized nutrition',
            'pt-BR': 'Nutrição personalizada com IA',
            'fr-FR': 'Nutrition personnalisée par IA',
            'it-IT': 'Nutrizione personalizzata con IA'
          };
          var CARGANDO = {
            'es-DO': 'Cargando',
            'en-US': 'Loading',
            'pt-BR': 'Carregando',
            'fr-FR': 'Chargement',
            'it-IT': 'Caricamento'
          };
          var loc = window.__mfLocale;
          if (loc && TAGLINE[loc]) {
            var el = document.querySelector('.splash-tagline');
            if (el) el.textContent = TAGLINE[loc];
            var dots = document.querySelector('.splash-dots');
            if (dots && CARGANDO[loc]) dots.setAttribute('aria-label', CARGANDO[loc]);
          }
        } catch (e) {
          /* el español del marcado ya es el fallback correcto */
        }
      })();
    </script>
  </div>
