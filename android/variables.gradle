ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    // [ANDROID-PLAY-TARGET-36 · 2026-11-13] 36: lo que Play exige para publicar (desde el 31-ago-2026).
    //
    // Hasta el APK 112 fue 34 a propósito [P1-PLAN-LOTE-152]: desde `targetSdk` 35 Android IMPONE el borde a borde
    // (la app se dibuja DEBAJO de la barra de estado, de la de navegación y del teclado) y con 36 ya no hay forma de
    // pedir la excepción. Nuestro CSS usa `env(safe-area-inset-*)`, que en el WebView vale 0, y el teclado del chat
    // depende de que la WebView se ENCOJA (lote 170).
    //
    // Quien lo resuelve ahora es `MainActivity.apartarDeBarrasYTeclado`: aparta la WebView de las barras y del
    // teclado con un padding, así que la web ve lo mismo que con 34. No subas ni bajes este número sin leerla.
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    // [P1-PLAN-LOTE-160 · 2026-09-22] Credential Manager («Continuar con Google»). 1.6.0 pide API 23 y
    // nuestro `minSdk` es 24, así que no arrastra el mínimo hacia arriba.
    androidxCredentialsVersion = '1.6.0'
    googleIdVersion = '1.1.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}